<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandeja de Solicitudes - UGEL 08 Cañete</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/logo-ugel08.svg" type="image/svg+xml">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased app-layout">

  <!-- Sidebar Unificado -->
  <aside class="sidebar" id="mainSidebar"></aside>

  <!-- Main Content Wrapper -->
  <main class="main-content">
    
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <div>
          <h2 class="topbar-title">Bandeja de Solicitudes de Copias y Resoluciones</h2>
          <p class="topbar-subtitle">Gestión de trámites, localización física de cajas y entrega de copias autenticadas</p>
        </div>
        <span class="badge badge-amber" style="font-weight: 700;">
          3 Solicitudes Activas
        </span>
      </div>

      <div class="flex items-center gap-3">
        <a href="documentos.html" class="px-4 py-2 bg-[#0A2540] hover:bg-slate-900 text-white rounded-lg text-xs font-bold transition flex items-center gap-2">
          <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          Visor de Documentos
        </a>
      </div>
    </header>

    <!-- Page Body -->
    <div class="p-8 flex-1 flex flex-col gap-6">
      
      <!-- Filters and Summary Card -->
      <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3 flex-wrap">
          <button class="px-4 py-2 bg-[#0A2540] text-white rounded-xl text-xs font-bold shadow">
            Todas (6)
          </button>
          <button class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold">
            Pendientes (3)
          </button>
          <button class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold">
            Documento Localizado (1)
          </button>
          <button class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold">
            Atendidas (2)
          </button>
        </div>

        <div class="relative w-full md:w-72">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" placeholder="Filtrar por código o solicitante..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:outline-none focus:border-blue-500 focus:bg-white transition">
        </div>
      </div>

      <!-- Requests List Table -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200 uppercase tracking-wider">
              <tr>
                <th class="p-3.5">Código Requerimiento</th>
                <th class="p-3.5">Fecha</th>
                <th class="p-3.5">Solicitante</th>
                <th class="p-3.5">Tipo</th>
                <th class="p-3.5">R.D. Solicitada</th>
                <th class="p-3.5">Año</th>
                <th class="p-3.5">Ubicación de Custodia</th>
                <th class="p-3.5">Estado</th>
                <th class="p-3.5">Acciones</th>
              </tr>
            </thead>
            <tbody id="solicitudesTableBody" class="divide-y divide-slate-100">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="js/mockData.js"></script>
<script src="js/services/apiClient.js"></script>
<script src="js/app.js"></script>
<script src="js/pdfViewer.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof renderSidebar === 'function') {
      renderSidebar('solicitudes');
    }
    const list = ResolutionStore.getSolicitudes();
    const tbody = document.getElementById('solicitudesTableBody');

    tbody.innerHTML = list.map(s => `
      <tr class="hover:bg-blue-50/50 transition">
        <td class="p-3.5 font-bold text-blue-600 font-mono text-sm">${s.codigo}</td>
        <td class="p-3.5 text-slate-600">${s.fecha}</td>
        <td class="p-3.5 font-semibold text-slate-900">${s.solicitante}</td>
        <td class="p-3.5 text-slate-500">${s.tipo}</td>
        <td class="p-3.5 font-bold text-[#0A2540]">${s.rdSolicitada}</td>
        <td class="p-3.5"><span class="bg-slate-100 px-2 py-0.5 rounded font-bold text-slate-700">${s.anio}</span></td>
        <td class="p-3.5">
          <span class="bg-amber-50 text-amber-900 border border-amber-200 px-2.5 py-1 rounded font-bold text-xs">
            📦 ${s.ubicacionFisica.caja}
          </span>
        </td>
        <td class="p-3.5">
          <span class="badge badge-${s.estado.toLowerCase().replace(/\s+/g, '-')}">
            ${s.estado}
          </span>
        </td>
        <td class="p-3.5">
          <div class="flex items-center gap-2">
            <a href="detalle-solicitud.html?id=${s.codigo}" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-xs shadow transition">
              Atender Pedido
            </a>
            <button onclick="openPdfViewer('${s.rdSolicitada}.pdf', 18, '4.8 MB', '${s.rdSolicitada}')" class="px-2.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-red-400 rounded-lg font-bold text-xs border border-slate-700 transition" title="Ver Documento PDF">
              PDF
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  });
</script>
</body>
</html>
