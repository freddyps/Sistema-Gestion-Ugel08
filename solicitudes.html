<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandeja de Solicitudes - UGEL 08 Cañete</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/logo-ugel-canete.jpg" type="image/jpeg">
</head>
<body class="page-app">

<div class="app-wrapper">
  <!-- Sidebar Unificado Oficial -->
  <aside class="sidebar" id="mainSidebar"></aside>

  <!-- Main Content Wrapper -->
  <main class="main-content">
    
    <!-- Topbar Institucional -->
    <header class="topbar">
      <div class="topbar-left">
        <div>
          <h2 class="topbar-title">Bandeja de Solicitudes de Copias y Resoluciones</h2>
          <p class="topbar-subtitle">Gestión institucional de requerimientos ciudadanos y localización en custodia</p>
        </div>
        <span class="badge badge-amber" id="solicitudesBadgeCount" style="font-weight: 700;">
          Cargando...
        </span>
      </div>

      <div class="topbar-right">
        <a href="entregas.html" class="btn btn-dark btn--rounded">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Entregas y Cargos
        </a>
      </div>
    </header>

    <!-- Page Body -->
    <div class="page-body">
      
      <!-- Filters and Summary Card -->
      <div class="filter-card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
          <!-- Filtros de Estado con botones estilizados -->
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;" id="filterStateButtons">
            <button type="button" class="btn btn-primary btn--sm" data-estado="TODOS" onclick="aplicarFiltroEstado('TODOS', this)">
              Todas las Solicitudes (<span id="countTodos">0</span>)
            </button>
            <button type="button" class="btn btn-light btn--sm" data-estado="PENDIENTE" onclick="aplicarFiltroEstado('PENDIENTE', this)">
              Pendientes (<span id="countPendientes">0</span>)
            </button>
            <button type="button" class="btn btn-light btn--sm" data-estado="DOCUMENTO LOCALIZADO" onclick="aplicarFiltroEstado('DOCUMENTO LOCALIZADO', this)">
              Documento Localizado (<span id="countLocalizadas">0</span>)
            </button>
            <button type="button" class="btn btn-light btn--sm" data-estado="ATENDIDA" onclick="aplicarFiltroEstado('ATENDIDA', this)">
              Atendidas (<span id="countAtendidas">0</span>)
            </button>
          </div>

          <!-- Búsqueda Rápida Institucional -->
          <div class="input-wrapper" style="min-width: 280px; max-width: 360px; width: 100%;">
            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="solicitudSearchInput" placeholder="Buscar por código, administrado o RD..." 
                   class="search-pill" oninput="ejecutarBusqueda()">
          </div>
        </div>
      </div>

      <!-- Requests List Table -->
      <div class="card" style="padding: 0; overflow: hidden;">
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Código Trámite</th>
                <th>Fecha</th>
                <th>Solicitante / Administrado</th>
                <th>Tipo Requerimiento</th>
                <th>R.D. Solicitada</th>
                <th>Ubicación de Custodia</th>
                <th>Estado</th>
                <th style="text-align: right;">Acciones</th>
              </tr>
            </thead>
            <tbody id="solicitudesTableBody">
              <!-- Renderizado dinámicamente mediante la Capa de Servicios -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

<div id="toastContainer"></div>

<!-- Capa de Datos y Servicios -->
<script src="js/data/mockDatabase.js"></script>
<script src="js/services/db.js"></script>
<script src="js/services/resolutionService.js"></script>
<script src="js/app.js"></script>
<script src="js/pdfViewer.js"></script>

<script>
  let estadoSeleccionado = "TODOS";

  document.addEventListener('DOMContentLoaded', () => {
    if (typeof renderSidebar === 'function') {
      renderSidebar('solicitudes');
    }
    actualizarBandeja();
  });

  function actualizarBandeja() {
    const stats = window.requestService.getStats();
    
    // Contadores en botones
    document.getElementById('countTodos').innerText = stats.total;
    document.getElementById('countPendientes').innerText = stats.pendientes;
    document.getElementById('countLocalizadas').innerText = stats.localizadas;
    document.getElementById('countAtendidas').innerText = stats.atendidas;

    document.getElementById('solicitudesBadgeCount').innerText = `${stats.pendientes + stats.localizadas} Requerimientos Activos`;

    ejecutarBusqueda();
  }

  function aplicarFiltroEstado(estado, btn) {
    estadoSeleccionado = estado;
    
    // Actualizar estilos activos de botones
    const btns = document.querySelectorAll('#filterStateButtons button');
    btns.forEach(b => {
      b.className = 'btn btn-light btn--sm';
    });
    btn.className = 'btn btn-primary btn--sm';

    ejecutarBusqueda();
  }

  function ejecutarBusqueda() {
    const query = document.getElementById('solicitudSearchInput').value.trim();
    const list = window.requestService.filter({
      estado: estadoSeleccionado,
      query: query
    });

    renderTabla(list);
  }

  function renderTabla(items) {
    const tbody = document.getElementById('solicitudesTableBody');
    if (!items.length) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8" class="text-center" style="padding: 40px; color: var(--slate-400);">
            No se encontraron solicitudes que coincidan con el criterio de búsqueda.
          </td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = items.map(s => {
      const caja = s.ubicacion_resumen ? s.ubicacion_resumen.caja : "Caja 001";
      const estadoClass = s.estado ? `badge-${s.estado.toLowerCase().replace(/\s+/g, '-')}` : 'badge-pendiente';

      return `
        <tr>
          <td class="td-code">${s.codigo}</td>
          <td class="td-muted" style="white-space: nowrap;">${s.fecha}</td>
          <td class="td-name">
            ${s.solicitante}
            ${s.dni ? `<br><span style="font-size: 11px; color: var(--slate-400);">DNI/Doc: ${s.dni}</span>` : ''}
          </td>
          <td class="td-muted">${s.tipo || 'Copia de resolución'}</td>
          <td class="td-primary" style="white-space: nowrap;">${s.rd_solicitada || s.rdSolicitada || 'R.D. Institucional'}</td>
          <td>
            <span class="badge-caja">
              📦 ${caja}
            </span>
          </td>
          <td>
            <span class="badge ${estadoClass}">
              ${s.estado}
            </span>
          </td>
          <td style="text-align: right;">
            <div style="display: inline-flex; align-items: center; gap: 8px;">
              <a href="detalle-solicitud.html?id=${s.codigo}" class="btn btn-primary btn--xs">
                Atender Trámite
              </a>
              <button type="button" onclick="verPdfDemo('${s.rd_solicitada || s.codigo}')" class="btn btn-dark btn--xs" title="Ver Documento">
                📄 PDF
              </button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function verPdfDemo(titulo) {
    if (typeof openPdfViewerModal === 'function') {
      openPdfViewerModal(titulo, 16, '4.2 MB');
    } else if (typeof openPdfViewer === 'function') {
      openPdfViewer(titulo + '.pdf', 16, '4.2 MB', titulo);
    } else {
      showToast('Visualizando documento digital...', 'info');
    }
  }
</script>
</body>
</html>
